- stage: DeployStg              # e.g. DeployStg / DeployProd
  displayName: 'Deploy to pipeline-stg (<env>)'
  dependsOn: Dev  # e.g. Deploy / DeployStg
  condition: succeeded()
  jobs:
  - deployment: DeployToOcp
    environment: 'stg'          # e.g. stg / prod — this is what pauses
                                   # for approval per Step 4
    pool:
      name: 'lab-ocp-agents'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@1
            inputs:
              action: 'deploy'
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceConnection: 'ocp-lab-<namespace>'
              namespace: 'pipeline-stg'
              manifests: '$(Pipeline.Workspace)/manifests/*.yaml'
              containers: '$(imageRepo):$(imageTag)'
---
- stage: DeployProd              # e.g. DeployStg / DeployProd
  displayName: 'Deploy to pipeline-prod (<env>)'
  dependsOn: DeployStg  # e.g. Deploy / DeployStg
  condition: succeeded()
  jobs:
  - deployment: DeployToOcp
    environment: 'prod'          # e.g. stg / prod — this is what pauses
                                   # for approval per Step 4
    pool:
      name: 'lab-ocp-agents'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@1
            inputs:
              action: 'deploy'
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceConnection: 'ocp-lab-<namespace>'
              namespace: 'pipeline-prod'
              manifests: '$(Pipeline.Workspace)/manifests/*.yaml'
              containers: '$(imageRepo):$(imageTag)'

# ASP.NET Core (.NET 6) - Build and Deploy to OCP (ado-pipeline namespace)
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core
#
# Replaces the original ASP.NET (.NET Framework) template: VSBuild/VSTest
# require a .sln file, but pipeline-dotNet is an ASP.NET Core project with
# only a .csproj, so 'Solution not found using search pattern **/*.sln' failed.
#
# Runs entirely on the self-hosted 'lab-ocp-agents' pool: the OCP API server
# (api.lab.ocp.local) and the local registry (svc-infra.ocp.local:5000) are
# only reachable inside the home LAN, so Microsoft-hosted agents can't be used.

trigger:
- main

variables:
  buildConfiguration: 'Release'
  projectPath: 'pipeline-dotNet/pipelines-dotnet-core.csproj'
  imageRepo: 'svc-infra.ocp.local:5000/ado-pipeline/pipeline-dotnet'
  imageTag: '$(Build.BuildId)'
  k8sServiceConnection: 'ocp-lab-ado-pipeline-dev'
  targetNamespace: 'ado-pipeline'

stages:
- stage: Build
  displayName: 'Build and push image'
  jobs:
  - job: Build
    pool:
      name: 'lab-ocp-agents'
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '6.0.x'
      displayName: 'Install .NET 6 SDK'

    - task: DotNetCoreCLI@2
      inputs:
        command: 'restore'
        projects: '$(projectPath)'
      displayName: 'Restore'

    - task: DotNetCoreCLI@2
      inputs:
        command: 'build'
        projects: '$(projectPath)'
        arguments: '--configuration $(buildConfiguration) --no-restore'
      displayName: 'Build'

    - script: |
        set -e
        podman build -t $(imageRepo):$(imageTag) -t $(imageRepo):latest -f pipeline-dotNet/Dockerfile pipeline-dotNet
        podman push $(imageRepo):$(imageTag)
        podman push $(imageRepo):latest
      displayName: 'Build and push container image'

    - publish: pipeline-dotNet/k8s
      artifact: manifests

- stage: Deploy
  displayName: 'Deploy to ado-pipeline (dev)'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployToOcp
    environment: 'dev'
    pool:
      name: 'lab-ocp-agents'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@1
            inputs:
              action: 'deploy'
              connectionType: 'kubernetesServiceConnection'
              kubernetesServiceConnection: '$(k8sServiceConnection)'
              namespace: '$(targetNamespace)'
              manifests: '$(Pipeline.Workspace)/manifests/*.yaml'
              containers: '$(imageRepo):$(imageTag)'

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-dotnet
  labels:
    app: pipeline-dotnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pipeline-dotnet
  template:
    metadata:
      labels:
        app: pipeline-dotnet
    spec:
      containers:
      - name: pipeline-dotnet
        image: svc-infra.ocp.local:5000/ado-pipeline/pipeline-dotnet:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
